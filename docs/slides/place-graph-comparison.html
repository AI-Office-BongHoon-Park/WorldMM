<style>
:root{--bg:#0b1020;--panel:#11192f;--panel2:#0e1730;--card:#0a1325;--line:#1c2746;--ink:#e9ecf5;--muted:#8aa0c8;--good:#22c55e;--bad:#ef4444;--warn:#f59e0b;--accent:#60a5fa;--hl:#fbbf24;--good-edge:rgba(34,197,94,.55);--accent-edge:rgba(96,165,250,.42);--warn-edge:rgba(245,158,11,.52);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--radius-md:10px;--radius-lg:14px;--radius-xl:16px;--text-xs:10.5px;--text-sm:11.5px;--text-md:14px;--text-lg:18px;--text-xl:28px}
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
.slide{width:1280px;height:720px;margin:0;padding:22px 26px;background:radial-gradient(circle at 18% 16%,color-mix(in srgb,var(--good) 12%,transparent),transparent 30%),radial-gradient(circle at 82% 18%,color-mix(in srgb,var(--warn) 10%,transparent),transparent 28%),var(--panel);border-radius:var(--radius-xl);display:grid;grid-template-rows:auto 1fr auto;gap:var(--space-4);overflow:hidden}
header{display:flex;justify-content:space-between;gap:var(--space-6);border-bottom:1px solid var(--line);padding-bottom:var(--space-2)}
.tag,.meta,.kicker,.foot,.verdict{font-family:var(--mono)}.tag{color:var(--accent);font-size:var(--text-xs);letter-spacing:1px;text-transform:uppercase;margin-bottom:var(--space-1)}
h1{margin:0;font-family:var(--mono);font-size:var(--text-xl);line-height:1.05;font-weight:850;letter-spacing:-.04em}h1 .axis{color:var(--good)}h1 .dot{color:var(--hl)}.meta{color:var(--muted);font-size:var(--text-sm);line-height:1.45;text-align:right;padding-top:var(--space-1)}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4);min-height:0}.col{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:var(--space-3);background:color-mix(in srgb,var(--panel2) 76%,transparent);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-4);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 7%,transparent)}
.col.aea{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 12%,transparent)}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-3)}h2{margin:0;font-family:var(--mono);font-size:var(--text-lg);letter-spacing:-.02em}.kicker{color:var(--muted);font-size:var(--text-xs);letter-spacing:.9px;text-transform:uppercase}.chip{color:var(--good);border:1px solid var(--line);border-radius:999px;padding:4px 9px;background:color-mix(in srgb,var(--card) 82%,transparent);font-family:var(--mono);font-size:var(--text-xs);white-space:nowrap}
.graph{position:relative;min-height:0;background:linear-gradient(180deg,color-mix(in srgb,var(--card) 88%,var(--accent)),var(--card));border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}.graph::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--line) 36%,transparent) 1px,transparent 1px),linear-gradient(0deg,color-mix(in srgb,var(--line) 30%,transparent) 1px,transparent 1px);background-size:42px 42px;opacity:.28}svg{position:relative;width:100%;height:100%;display:block}.link{stroke:var(--accent-edge);stroke-linecap:round}.node circle{stroke:var(--bg);stroke-width:2px;filter:drop-shadow(0 0 12px color-mix(in srgb,var(--good) 28%,transparent))}.node text{fill:var(--ink);font-family:var(--mono);font-size:9px;text-anchor:middle;pointer-events:none}.node .count{fill:var(--muted);font-size:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-2)}.stat{border:1px solid var(--line);border-radius:var(--radius-md);background:var(--card);padding:var(--space-2);min-width:0}.num{font-family:var(--mono);font-size:20px;font-weight:850;color:var(--ink);line-height:1}.lbl{margin-top:var(--space-1);color:var(--muted);font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;white-space:nowrap}.foot{display:flex;justify-content:space-between;gap:var(--space-3);color:var(--muted);font-size:9.5px;line-height:1.25}.foot b{color:var(--warn);font-weight:800}
.verdict{display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:var(--radius-lg);background:linear-gradient(90deg,color-mix(in srgb,var(--good) 11%,var(--panel2)),color-mix(in srgb,var(--warn) 10%,var(--panel2)));color:var(--ink);font-size:17px;font-weight:850;letter-spacing:-.01em;padding:var(--space-3)}
</style>
</head>
<body>
<div class="slide">
<header><div><div class="tag">WorldMM spatial axis · place graph comparison</div><h1>EgoLife <span class="dot">vs</span> AEA <span class="axis">richness gap</span></h1></div><div class="meta">same DBSCAN/place-anchor pipeline vocabulary<br>miniature D3 force graphs from source JSON</div></header>
<main class="compare"><section class="col ego" id="ego"><div class="head"><div><div class="kicker"></div><h2></h2></div><div class="chip"></div></div><div class="graph"><svg viewBox="0 0 574 390" aria-label="EgoLife place graph miniature"></svg></div><div class="stats"></div><div class="foot"><span></span><b></b></div></section><section class="col aea" id="aea"><div class="head"><div><div class="kicker"></div><h2></h2></div><div class="chip"></div></div><div class="graph"><svg viewBox="0 0 574 390" aria-label="AEA place graph miniature"></svg></div><div class="stats"></div><div class="foot"><span></span><b></b></div></section></main>
<div class="verdict">Same algorithm, different recording. The gap is mobility × duration, not pipeline capability.</div>
</div>

<script>
const data=JSON.parse(document.getElementById('graph-data').textContent),palette=['var(--good)','var(--accent)','var(--warn)','var(--hl)','var(--muted)'];
for(const key of ['ego','aea']){const card=document.getElementById(key),d=data[key];card.querySelector('h2').textContent=d.title;card.querySelector('.kicker').textContent=d.kicker;card.querySelector('.chip').textContent=`${d.nodes.length} places · ${d.links.length} links`;card.querySelector('.stats').innerHTML=d.stats.map(([l,v])=>`<div class="stat"><div class="num">${v}</div><div class="lbl">${l}</div></div>`).join('');card.querySelector('.foot span').textContent=`source: ${d.source}`;card.querySelector('.foot b').textContent=d.note;draw(card.querySelector('svg'),d,key==='aea');}
function draw(svgEl,d,isAea){const svg=d3.select(svgEl),w=574,h=390;svg.append('circle').attr('cx',w/2).attr('cy',h/2).attr('r',isAea?126:165).attr('fill','none').attr('stroke','var(--line)').attr('stroke-dasharray','4 7');const links=svg.append('g').selectAll('line').data(d.links).join('line').attr('class','link').attr('stroke-width',e=>1+Math.log1p(e.count)*1.8);const nodes=svg.append('g').selectAll('g').data(d.nodes).join('g').attr('class','node');nodes.append('circle').attr('r',n=>n.radius).attr('fill',(n,i)=>palette[i%palette.length]);nodes.append('text').attr('dy',n=>-n.radius-5).text((n,i)=>i<10||isAea?n.id:'');nodes.append('text').attr('class','count').attr('dy',n=>n.radius+11).text(n=>`${n.count}×`);const sim=d3.forceSimulation(d.nodes).force('link',d3.forceLink(d.links).id(n=>n.id).distance(e=>72+Math.log1p(e.count)*20).strength(.58)).force('charge',d3.forceManyBody().strength(n=>isAea?-60:-150-n.radius*4)).force('center',d3.forceCenter(w/2,h/2)).force('collide',d3.forceCollide().radius(n=>n.radius+18)).on('tick',()=>{links.attr('x1',e=>e.source.x).attr('y1',e=>e.source.y).attr('x2',e=>e.target.x).attr('y2',e=>e.target.y);nodes.attr('transform',n=>`translate(${n.x},${n.y})`);});if(isAea&&d.nodes[0]){d.nodes[0].fx=w/2;d.nodes[0].fy=h/2;}}
